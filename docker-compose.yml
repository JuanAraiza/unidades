services:

    # Webserver service configuration
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: unidades
        ports:
            - "8001:80"
        networks:
            - app_networkk
        environment:
            - APP_URL=http://31.220.104.242:8001
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3307
            - DB_DATABASE=unisistom
            - DB_USERNAME=root
            - DB_PASSWORD=root
        depends_on:
            - db
                

    # Database service configuration
    db:
        image: mysql:8.0
        container_name: db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: unisistom
            MYSQL_TCP_PORT: 3307
        volumes:
            - db_datau:/var/lib/mysql
            
        ports:
            - 3307:3307
        expose:
            - 3307
        networks:
            - app_networkk # Create a database named "todos"
    ftp:
        image: stilliard/pure-ftpd:latest # o alguna otra imagen de servidor FTP
        container_name: mi_servidor_ftp
        environment:
        - FTP_USER_NAME=usuarioftp
        - FTP_USER_PASS=Juarra1508
        - FTP_USER_HOME=/var/www/html/
        - FTP_PASSIVE_PORTS= 21010:21019
        volumes:
        - ./:/var/www/html:rw # Mapea un directorio local a uno dentro del contenedor
        ports:
        - "2101:21" # Puerto de control FTP
        - "21010-21019:21010-21019"
        expose:
        - "21010-21019" # Ejemplo de puerto pasivo, puede necesitar más [12]
        restart: unless-stopped
        depends_on:
            - app
        networks:
            - app_networkk # Create a database named "todos"
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadminunidades
        environment:
            PMA_HOST: db
            PMA_PORT: 3307
            PPMA_USER: root
            PMA_PASSWORD: root
        ports:
            - "8181:80"
        depends_on:
            - db
        networks:
            - app_networkk
        volumes:
            - ./.docker/php/zzz-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini

networks:
  app_networkk:
    driver: bridge

volumes:
  db_datau: